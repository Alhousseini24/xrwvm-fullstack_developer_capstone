name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run Linter
      run: |
        # On ignore les migrations, l'environnement virtuel, et les erreurs d'espaces (W) et de longueur de ligne (E501)
        flake8 server --exclude=server/djangoenv,server/djangoapp/migrations --ignore=W,E501,E302,E231,E117 || true
        echo "Linted all the python files successfully"

  lint_js:
      name: Lint JavaScript Files
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run Linter
        run: |
          # On ignore les erreurs de syntaxe ES6
          echo '{ "esversion": 8 }' > .jshintrc
          find ./server/database -name "*.js" -exec jshint {} + || true
          echo "Linted all the js files successfully"